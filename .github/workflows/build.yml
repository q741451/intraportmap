name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      log_level:
        description: 'Log level'
        required: true
        default: 'warning'

jobs:
  build-macos-arm64:
    name: Build macOS arm64
    runs-on: macos-14
    strategy:
      matrix:
        architecture: ['aarch64']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build
        run: |
          brew install autoconf
          brew install automake
          brew install wget
          wget https://github.com/libevent/libevent/releases/download/release-2.1.12-stable/libevent-2.1.12-stable.tar.gz
          tar -zxf libevent-2.1.12-stable.tar.gz
          cd libevent-2.1.12-stable/
          ./configure --prefix=${{ github.workspace }}/libevent-2.1.12-stable/install-bin/${{ matrix.architecture }} --enable-static --disable-shared --disable-openssl
          make
          make install
          cd ..
          ./autogen.sh
          ./configure --with-event=${{ github.workspace }}/libevent-2.1.12-stable/install-bin/${{ matrix.architecture }}
          make
          cp src/intraportmap intraportmap
          strip intraportmap
          tar -zcf intraportmap-macos14-${{ matrix.architecture }}.tar.gz intraportmap 

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: intraportmap-macos14-${{ matrix.architecture }}
          path: intraportmap-macos14-${{ matrix.architecture }}.tar.gz
          
  build-docker-cross:
    name: Build linux
    runs-on: ubuntu-latest
    container: "abcfy2/muslcc-toolchain-ubuntu:${{ matrix.cross_host }}"
    strategy:
      matrix:
        cross_host: ['arm-linux-musleabi', 'aarch64-linux-musl', 'mips-linux-musl', 'mipsel-linux-musl', 'mips64-linux-musl', 'x86_64-linux-musl', 'i686-linux-musl']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build
        run: |
          apt-get update
          apt-get install -y autoconf
          apt-get install -y wget
          apt-get install -y make
          wget https://github.com/libevent/libevent/releases/download/release-2.1.12-stable/libevent-2.1.12-stable.tar.gz
          tar -zxf libevent-2.1.12-stable.tar.gz
          cd libevent-2.1.12-stable/
          # libevent 也要带上 --ffunction-sections，否则最后链接的 --gc-sections
          # 在库内部使不上劲：为了一个 evdns_getaddrinfo 就要把整个
          # evdns.o（45.6K）拉进来。本机实测成品 275.1K -> 163.0K
          ./configure --prefix=${{ github.workspace }}/libevent-2.1.12-stable/install-bin/${{ matrix.cross_host }} --host=${{ matrix.cross_host }} --enable-static --disable-shared --disable-openssl \
            --disable-debug-mode --disable-libevent-regress --disable-samples \
            CFLAGS="-Os -ffunction-sections -fdata-sections"
          make
          make install
          cd ..
          ./autogen.sh
          ./configure --with-event=${{ github.workspace }}/libevent-2.1.12-stable/install-bin/${{ matrix.cross_host }} --enable-static --host=${{ matrix.cross_host }} \
            CXXFLAGS="-Os -fno-exceptions -fno-rtti -fno-asynchronous-unwind-tables -ffunction-sections -fdata-sections -fno-pie" \
            LDFLAGS="-Wl,--gc-sections -Wl,--build-id=none -no-pie"
          make
          cp src/intraportmap intraportmap
          ${{ matrix.cross_host }}-strip intraportmap
          ls -l intraportmap
          tar -zcf intraportmap-${{ matrix.cross_host }}.tar.gz intraportmap 

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: intraportmap-${{ matrix.cross_host }}
          path: intraportmap-${{ matrix.cross_host }}.tar.gz

  build-win:
    name: Build Windows
    runs-on: ubuntu-latest
    # 在容器里编译，把工具链版本钉死。裸 runner 上用 apt 装 mingw-w64，版本会跟着
    # ubuntu-latest 漂：它从 20.04 挪到 24.04 时 mingw 从 7.0.0 变成 11.0.1，
    # 在编译参数一字未改的情况下让 i686 产物大了 17%。
    # ubuntu:20.04 提供 mingw-w64 7.0.0 + GCC 9.3.0，做法与上面各 musl job 一致。
    container: "ubuntu:20.04"
    strategy:
      matrix:
        architecture: ['x86_64', 'i686']
    steps:
      # 官方镜像很精简，连 git、ca-certificates 都没有，
      # checkout 之前就要装好
      - name: Install toolchain
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git wget zip make autoconf automake g++ mingw-w64
          i686-w64-mingw32-g++ --version | head -1

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build
        run: |
          wget https://github.com/libevent/libevent/releases/download/release-2.1.12-stable/libevent-2.1.12-stable.tar.gz
          tar -zxf libevent-2.1.12-stable.tar.gz
          cd libevent-2.1.12-stable/
          ./configure --prefix=${{ github.workspace }}/libevent-2.1.12-stable/install-bin/windows-${{ matrix.architecture }} --host=${{ matrix.architecture }}-w64-mingw32 --enable-static --disable-shared --disable-openssl
          make
          make install
          cd ..
          ./autogen.sh
          ./configure LIBS="-lws2_32 -liphlpapi" --with-event=${{ github.workspace }}/libevent-2.1.12-stable/install-bin/windows-${{ matrix.architecture }} --enable-static --host=${{ matrix.architecture }}-w64-mingw32
          make
          cp src/intraportmap.exe intraportmap.exe
          ${{ matrix.architecture }}-w64-mingw32-strip intraportmap.exe
          zip intraportmap-windows-${{ matrix.architecture }}.zip intraportmap.exe

      # XP 兼容性断言。PE 的导入是加载期解析的，导入表里只要留着一个
      # XP 没有的名字，进程就起不来，哪怕运行时压根走不到那段代码。
      # 工具链或依赖换代时很容易悄悄引入新导入，所以在这里卡住
      - name: Check imports are XP-safe
        run: |
          OBJDUMP=${{ matrix.architecture }}-w64-mingw32-objdump
          $OBJDUMP -p intraportmap.exe | awk '/DLL Name:/{print toupper($3)}' | sort -u > dlls.txt
          $OBJDUMP -p intraportmap.exe | awk '/^\t[0-9a-f]+\t/{print $NF}' | sort -u > syms.txt
          echo "imports: $(wc -l < syms.txt) symbols from:"; cat dlls.txt
          OK_DLL='^(ADVAPI32|KERNEL32|MSVCRT|SHELL32|WS2_32)\.DLL$'
          VISTA_SYM='^(GetTickCount64|InitOnceExecuteOnce|InitializeSRWLock|AcquireSRWLock.*|ReleaseSRWLock.*|InitializeConditionVariable|SleepConditionVariable.*|Wake(All)?ConditionVariable|GetSystemTimePreciseAsFileTime|CancelIoEx|GetThreadId|WSAPoll|inet_ntop|inet_pton|if_nametoindex|if_indextoname|RegGetValue[AW]|CreateThreadpool.*)$'
          rc=0
          if grep -vE "$OK_DLL" dlls.txt; then
            echo "::error::unexpected DLL import above, binary will not load on Windows XP"
            rc=1
          fi
          if grep -E "$VISTA_SYM" syms.txt; then
            echo "::error::Vista+ symbol imported above, binary will not load on Windows XP"
            rc=1
          fi
          exit $rc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: intraportmap-windows-${{ matrix.architecture }}
          path: intraportmap-windows-${{ matrix.architecture }}.zip

  release:
    needs: [build-docker-cross, build-win, build-macos-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -l release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
